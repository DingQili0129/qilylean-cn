<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-label="场景简图｜职业发展">
<style>text{font-family:Arial,'Microsoft YaHei','PingFang SC',sans-serif;fill:#12313a}.title{font-size:58px;font-weight:900}.sub{font-size:25px;fill:#526967}.h{font-size:29px;font-weight:850}.b{font-size:22px}.s{font-size:18px;fill:#526967}.num{font-size:30px;font-weight:900}.white{fill:#fff}.teal{fill:#0f6f78}.green{fill:#1f653d}.gold{fill:#c88d00}</style>
<rect width="1440" height="1080" fill="#fff"/>
<text x="720" y="76" text-anchor="middle" class="title">场景简图｜职业发展</text>
<line x1="490" y1="111" x2="675" y2="111" stroke="#0f6f78" stroke-width="4"/><circle cx="720" cy="111" r="7" fill="#c88d00"/><line x1="765" y1="111" x2="950" y2="111" stroke="#0f6f78" stroke-width="4"/>
<text x="720" y="158" text-anchor="middle" class="sub">职场里的“天花板”通常不是努力一点就能达成的目标，而是当前体系内的晋升或能力上限。</text>
<rect x="35" y="220" width="1000" height="720" rx="20" fill="#fff" stroke="#0f6f78" stroke-width="2"/>
<rect x="110" y="830" width="170" height="80" fill="#0f6f78" opacity=".95"/><rect x="280" y="710" width="170" height="120" fill="#0f6f78" opacity=".95"/><rect x="450" y="590" width="170" height="120" fill="#0f6f78" opacity=".95"/><rect x="620" y="470" width="170" height="120" fill="#c88d00" opacity=".95"/><rect x="790" y="350" width="170" height="120" fill="#1f653d" opacity=".95"/>
<circle cx="138" cy="858" r="25" fill="#fff"/><text x="138" y="867" text-anchor="middle" class="b" font-weight="900" fill="#0f6f78">01</text><circle cx="308" cy="738" r="25" fill="#fff"/><text x="308" y="747" text-anchor="middle" class="b" font-weight="900" fill="#0f6f78">02</text><circle cx="478" cy="618" r="25" fill="#fff"/><text x="478" y="627" text-anchor="middle" class="b" font-weight="900" fill="#0f6f78">03</text><circle cx="648" cy="498" r="25" fill="#fff"/><text x="648" y="507" text-anchor="middle" class="b" font-weight="900" fill="#c88d00">04</text><circle cx="818" cy="378" r="25" fill="#fff"/><text x="818" y="387" text-anchor="middle" class="b" font-weight="900" fill="#1f653d">05</text>
<circle cx="132" cy="772" r="18" fill="#0f6f78"/><line x1="132" y1="790" x2="132" y2="808" stroke="#0f6f78" stroke-width="12"/><line x1="132" y1="794" x2="160" y2="766" stroke="#0f6f78" stroke-width="10"/><line x1="132" y1="794" x2="110" y2="802" stroke="#0f6f78" stroke-width="10"/><line x1="132" y1="808" x2="116" y2="830" stroke="#0f6f78" stroke-width="12"/><line x1="132" y1="808" x2="150" y2="830" stroke="#0f6f78" stroke-width="12"/>
<text x="165" y="774" class="h" fill="#0f6f78">当前：</text><text x="165" y="802" class="b" font-weight="850" fill="#0f6f78">IE工程师</text><text x="245" y="654" class="h" fill="#0f6f78">目标：</text><text x="245" y="682" class="b" font-weight="850" fill="#0f6f78">高级工程师</text><text x="455" y="534" class="h" fill="#0f6f78">挑战目标：</text><text x="455" y="562" class="b" font-weight="850" fill="#0f6f78">工程主管</text><text x="625" y="386" class="h" fill="#c88d00">天花板：</text><text x="625" y="414" class="b" font-weight="850" fill="#c88d00">当前组织体系内</text><text x="625" y="442" class="b" font-weight="850" fill="#c88d00">可到达的上限</text><text x="795" y="266" class="h" fill="#1f653d">标杆：</text><text x="795" y="294" class="b" font-weight="850" fill="#1f653d">行业优秀同岗位</text><text x="795" y="322" class="b" font-weight="850" fill="#1f653d">能力标准</text>
<rect x="1060" y="220" width="345" height="720" rx="20" fill="#fff" stroke="#0f6f78" stroke-width="2"/><rect x="1060" y="220" width="345" height="90" rx="20" fill="#0f6f78"/><rect x="1060" y="290" width="345" height="20" fill="#0f6f78"/><text x="1232" y="277" text-anchor="middle" class="h white">管理提醒</text><circle cx="1110" cy="380" r="28" fill="#0f6f78"/><text x="1110" y="389" text-anchor="middle" class="b white" font-weight="900">01</text><text x="1160" y="365" class="b">“目标”要写清时间、</text><text x="1160" y="399" class="b">标准和结果。</text><line x1="1090" y1="460" x2="1375" y2="460" stroke="#d5e4e3" stroke-width="2"/><circle cx="1110" cy="525" r="28" fill="#0f6f78"/><text x="1110" y="534" text-anchor="middle" class="b white" font-weight="900">02</text><text x="1160" y="510" class="b">“挑战目标”可以更高，</text><text x="1160" y="544" class="b">但仍需可争取。</text><line x1="1090" y1="605" x2="1375" y2="605" stroke="#d5e4e3" stroke-width="2"/><circle cx="1110" cy="670" r="28" fill="#0f6f78"/><text x="1110" y="679" text-anchor="middle" class="b white" font-weight="900">03</text><text x="1160" y="650" class="b">若已接近“天花板”，</text><text x="1160" y="684" class="b">应考虑岗位、组织或</text><text x="1160" y="718" class="b">能力结构升级。</text>
<line x1="40" y1="1030" x2="520" y2="1030" stroke="#0f6f78" stroke-width="3"/><text x="720" y="1041" text-anchor="middle" font-size="26" font-weight="800">QilyLean｜启力精益</text><line x1="920" y1="1030" x2="1400" y2="1030" stroke="#0f6f78" stroke-width="3"/>
</svg>
